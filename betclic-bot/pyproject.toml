[project]
name = "betclic-bot"
version = "1.0.0"
description = "Détecteur de value bets Sweet Spot sur Betclic (Pinnacle comme référence)"
requires-python = ">=3.9"
dependencies = ["requests>=2.31,<3", "python-dotenv>=1.0,<2", "PyYAML>=6.0,<7", "tzdata>=2024.1"]

[project.scripts]
betclic-bot = "betclic_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
